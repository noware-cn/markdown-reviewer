<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 文档审批工作台 · noware-cn/workspace</title>
<link rel="stylesheet" href="/styles.css?v=344">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body class="list-mode">

<!-- ===== 任务列表视图（默认） ===== -->
<header class="topbar" id="listTopbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">Markdown 审批工作台</span>
    <span class="brand-sub">noware-cn / workspace</span>
  </div>
  <div class="account">
    <span class="source-badge" id="sourceBadge">数据加载中</span>
    <span class="sync-at" id="syncAt">加载中</span>
    <button class="refresh-btn" id="refreshBtn" type="button">刷新</button>
    <span class="user-chip" id="userChip">未登录</span>
    <a class="logout" href="/auth/logout">退出</a>
  </div>
</header>

<main class="layout" id="listLayout">
  <section class="list-sheet" aria-labelledby="listTitle">
    <div class="title-row">
      <div class="title-block">
        <h1 id="listTitle">Pull Requests</h1>
        <p class="subline" id="listMeta">—</p>
      </div>
    </div>

    <div class="tabs" id="filters" aria-label="按状态筛选">
      <button class="chip active" type="button" data-state="all" aria-pressed="true">全部</button>
      <button class="chip" type="button" data-state="open" aria-pressed="false">进行中</button>
      <button class="chip" type="button" data-state="merged" aria-pressed="false">已合并</button>
      <button class="chip" type="button" data-state="closed" aria-pressed="false">已关闭</button>
    </div>

    <div class="toolbar">
      <div class="search">
        <input id="search" type="search" placeholder="搜索标题、单号或提交人" autocomplete="off">
      </div>
    </div>

    <div class="list-head" aria-hidden="true">
      <span>编号</span><span>标题</span><span>提交人</span><span>更新时间</span><span>状态</span>
    </div>
    <ul class="list" id="list"></ul>
    <div class="detail" id="detail" hidden></div>
  </section>
</main>

<!-- ===== 工作台视图（全屏，进入 PR 后显示） ===== -->
<div class="workbench" id="workbench" hidden>
  <div class="dloading" id="wbLoading" hidden><span class="spin"></span><span>正在从 GitHub 加载…</span></div>
  <header class="wb-topbar">
    <button class="wb-back" id="wbBack" type="button" title="返回任务列表" aria-label="返回任务列表">← 返回列表</button>
    <button class="wb-nav-toggle" id="wbNavToggle" type="button" title="切换文件导航" aria-label="切换文件导航"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 3.5h11M1.5 7h11M1.5 10.5h11"/></svg></button>
    <button class="wb-nav-toggle" id="wbOutlineToggle" type="button" title="显示/隐藏文档大纲" aria-label="显示/隐藏文档大纲" aria-expanded="true"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.5h4M2 7h4M2 10.5h4M8 3.5h4M8 7h4M8 10.5h4"/></svg></button>
    <span class="wb-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="wb-brand-text">审批工作台</span>
    </span>
    <span class="wb-orig-wrap" id="wbOrigWrap" hidden>
      <a class="wb-orig" id="wbOrig" href="#" target="_blank" rel="noopener">原始 PR</a>
      <button class="wb-orig-copy" id="wbOrigCopy" type="button" title="复制 PR 链接">复制</button>
    </span>
    <span class="wb-commit-pick" id="wbCommitPick" hidden>
      <label class="wb-commit-label" for="wbCommitSelect">版本</label>
      <select class="wb-commit-select" id="wbCommitSelect" aria-label="选择查看的提交版本"></select>
    </span>
    <button class="wb-refresh" id="wbRefresh" type="button" title="刷新 PR 数据（文件与评论）" aria-label="刷新 PR 数据">↻</button>
    <span class="wb-sep" aria-hidden="true"></span>
    <div class="wb-viewstate" role="group" aria-label="显示">
      <button type="button" data-view-state="markup" aria-pressed="true" title="显示改动记号与评论">改动与评论</button>
      <button type="button" data-view-state="final" aria-pressed="false" title="只看定稿">定稿</button>
      <button type="button" data-view-state="original" aria-pressed="false" title="只看改前">改前</button>
    </div>
    <button class="wb-focus-btn" id="wbFocusBtn" type="button" title="全屏阅读（F）" aria-pressed="false">⛶</button>
    <div class="wb-look">
      <button class="wb-look-btn" id="wbLookBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="wbLookPop" title="文档主题与表格样式">外观</button>
      <div class="wb-look-pop" id="wbLookPop" hidden>
        <div class="look-group">
          <span class="look-label">文档主题</span>
          <div class="look-swatches" role="radiogroup" aria-label="文档主题">
            <button type="button" data-theme="paper" role="radio" aria-checked="true"><span class="sw sw-paper"></span>纸白</button>
            <button type="button" data-theme="sepia" role="radio" aria-checked="false"><span class="sw sw-sepia"></span>暖纸</button>
            <button type="button" data-theme="night" role="radio" aria-checked="false"><span class="sw sw-night"></span>夜读</button>
          </div>
        </div>
        <div class="look-group">
          <span class="look-label">阅读宽度</span>
          <div class="look-seg" role="radiogroup" aria-label="阅读宽度">
            <button type="button" data-read="narrow" role="radio" aria-checked="false">窄</button>
            <button type="button" data-read="standard" role="radio" aria-checked="true">标准</button>
            <button type="button" data-read="wide" role="radio" aria-checked="false">宽</button>
          </div>
        </div>
        <div class="look-group">
          <span class="look-label">文档缩放</span>
          <div class="look-seg" role="radiogroup" aria-label="文档缩放">
            <button type="button" data-zoom="0.9" role="radio" aria-checked="false">90%</button>
            <button type="button" data-zoom="1" role="radio" aria-checked="true">100%</button>
            <button type="button" data-zoom="1.15" role="radio" aria-checked="false">115%</button>
            <button type="button" data-zoom="1.3" role="radio" aria-checked="false">130%</button>
            <button type="button" data-zoom="1.5" role="radio" aria-checked="false">150%</button>
          </div>
        </div>
        <div class="look-group">
          <span class="look-label">表格样式</span>
          <div class="look-seg" role="radiogroup" aria-label="表格样式">
            <button type="button" data-tbl="grid" role="radio" aria-checked="true">网格</button>
            <button type="button" data-tbl="zebra" role="radio" aria-checked="false">斑马</button>
            <button type="button" data-tbl="plain" role="radio" aria-checked="false">极简</button>
          </div>
        </div>
      </div>
    </div>
    <span class="wb-sep" aria-hidden="true"></span>
    <button class="wb-rvcount" id="wbReviewCount" type="button" hidden title="打开改动清单">已阅 0/0</button>
    <button class="wb-drawer-btn" id="wbDrawerBtn" type="button" title="打开意见面板">意见 <span class="wb-badge" id="wbCommentCount">0</span><span class="wb-badge draft" id="wbDraftCount" hidden>0</span></button>
  </header>

  <div class="wb-body" id="wbBody">
    <aside class="wb-nav" id="wbNav">
      <div class="wb-nav-head">
        <span class="wb-nav-title">变更文件</span>
        <span class="wb-progress" id="wbProgress"></span>
        <button class="wb-nav-fold" id="wbNavFold" type="button" title="隐藏导航" aria-label="隐藏导航">◀</button>
      </div>
      <section class="wb-view wb-view-files" id="wbFilesView">
        <button class="wb-view-head" id="wbFilesHead" type="button" aria-expanded="true" aria-controls="wbFiles">
          <span class="chev" aria-hidden="true"></span><span class="wb-view-label">文件</span>
          <span class="wb-view-meta" id="wbFilesMeta"></span>
        </button>
      <div class="wb-view-ctl" role="group" aria-label="文件面板布局">
        <button type="button" data-panel="files" data-layout="docked" title="停靠" aria-pressed="true">▥</button>
        <button type="button" data-panel="files" data-layout="floating" title="悬浮" aria-pressed="false">⧉</button>
        <button type="button" data-panel="files" data-layout="hidden" title="隐藏" aria-pressed="false">✕</button>
      </div>
        <div class="wb-nav-tools">
        <input class="wb-filter" id="wbFilter" type="search" placeholder="筛选文件路径" autocomplete="off">
        <div class="wb-viewseg" role="group" aria-label="文件列表视图">
          <button type="button" data-view="tree" aria-pressed="true" title="树状视图（目录结构）">树状</button>
          <button type="button" data-view="flat" aria-pressed="false" title="平铺视图（单层列表）">平铺</button>
        </div>
      </div>
      <div class="wb-files" id="wbFiles" role="tree" tabindex="0" aria-label="变更文件"></div>
      </section>
      <div class="wb-sash" id="wbSashY" role="separator" aria-orientation="horizontal" tabindex="0"
        title="拖动调整上下高度（双击复位）"></div>
      <section class="wb-view wb-view-chapters" id="wbChaptersView">
        <button class="wb-view-head" id="wbChaptersHead" type="button" aria-expanded="true" aria-controls="wbChapters">
          <span class="chev" aria-hidden="true"></span><span class="wb-view-label">大纲</span>
          <span class="wb-view-meta" id="wbChaptersMeta"></span>
        </button>
      <div class="wb-view-ctl" role="group" aria-label="大纲面板布局">
        <button type="button" data-panel="outline" data-layout="docked" title="停靠" aria-pressed="true">▥</button>
        <button type="button" data-panel="outline" data-layout="floating" title="悬浮" aria-pressed="false">⧉</button>
        <button type="button" data-panel="outline" data-layout="hidden" title="隐藏" aria-pressed="false">✕</button>
      </div>
        <div class="wb-chapters" id="wbChapters"></div>
      </section>
    </aside>

    <div class="wb-sash-col" id="wbSashX" role="separator" aria-orientation="vertical" tabindex="0"
      title="拖动调整左栏宽度（双击复位）" aria-label="调整左栏宽度"></div>

    <div class="wb-pane" id="wbPane">
      <div class="wb-titlerow">
        <div class="wb-title-block">
          <div class="wb-title" id="wbPrTitle">—</div>
          <p class="wb-subline" id="wbStats"></p>
        </div>
      </div>
      <div class="wb-commit-bar" id="wbCommitBar" hidden></div>
      <main class="wb-doc" id="wbDoc">
      <div class="wb-filepath" id="wbFilepath" hidden>
        <span class="fp-mark" id="wbFilepathMark"></span>
        <span class="fp-dir" id="wbFilepathDir"></span>
        <span class="fp-name" id="wbFilepathName"></span>
      </div>
        <article class="wb-content" id="wbContent"></article>
      </main>
    </div>

    <aside class="wb-drawer" id="wbDrawer">
      <div class="wb-drawer-head">
        <span>意见与草稿</span>
        <span class="wb-panelctl" role="group" aria-label="意见面板布局">
          <button type="button" data-panel="right" data-layout="docked" title="停靠" aria-pressed="false">▥</button>
          <button type="button" data-panel="right" data-layout="floating" title="悬浮" aria-pressed="false">⧉</button>
        </span>
        <button class="wb-drawer-fold" id="wbDrawerFold" type="button" title="隐藏面板">▶</button>
      </div>
      <div class="wb-drawer-body" id="wbDrawerBody"></div>
    </aside>
  </div>
</div>

<button class="wb-drawer-open" id="wbDrawerOpen" type="button" title="打开意见面板" hidden>意见</button>
<button class="selchip" id="dselchip" type="button" hidden>评论所选</button>
<div class="nav-float" id="navFloat" hidden>
  <button type="button" id="navPrev" title="上一处变更 (p)">↑</button>
  <span id="navCount">0/0</span>
  <button type="button" id="navNext" title="下一处变更 (n)">↓</button>
</div>
<div class="focusbar" id="focusBar" hidden>
  <button type="button" id="focusZoomOut" title="缩小">−</button>
  <span class="focusbar-zoom" id="focusZoomLabel">100%</span>
  <button type="button" id="focusZoomIn" title="放大">+</button>
  <span class="focusbar-sep" aria-hidden="true"></span>
  <button type="button" id="focusOutline" aria-pressed="true" title="显示/隐藏左侧大纲">大纲</button>
  <button type="button" id="focusDrawer">意见</button>
  <button type="button" id="focusExit" title="退出全屏（Esc）">退出全屏</button>
</div>
<div class="dtoast" id="dtoast" role="status"></div>
<script src="/marked.min.js?v=1"></script>
<script src="/purify.min.js?v=1"></script>
<script>
/* marked + DOMPurify 配置：GFM 表格；链接新窗口打开 */
window.marked.setOptions({ gfm: true, breaks: false });
window.DOMPurify.addHook("afterSanitizeAttributes", (node) => {
  /* 只给外链加 target：站内锚点（#L12）与 /doc/、相对文档链接要留在工作台里 */
  if (node.tagName !== "A") return;
  const href = node.getAttribute("href") || "";
  if (!/^https?:\/\//i.test(href)) return;
  node.setAttribute("target", "_blank");
  node.setAttribute("rel", "noopener noreferrer");
});
</script>
<script src="/route.js?v=2"></script>
<script src="/diff-model.js?v=211"></script>
<script src="/highlight.min.js?v=1"></script>
<script src="/semdiff.js?v=2"></script>
<script src="/diff.js?v=266"></script>
<script src="/app.js?v=220"></script>
</body>
</html>
