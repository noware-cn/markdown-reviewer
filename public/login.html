<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 审批可视化</title>
<link rel="stylesheet" href="/styles.css?v=323">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body class="login-body">
<header class="login-top">
  <span class="brand-mark" aria-hidden="true"></span>
  <span class="login-top-name">Markdown 审批工作台</span>
</header>
<main class="login-card">
  <div class="login-intro">
    <span class="brand-mark big" aria-hidden="true"></span>
    <h1>审批可视化</h1>
    <p class="login-sub">noware-cn / workspace 仓库的审批单据与审批链路</p>
  </div>
  <div class="login-act">
    <p class="login-note">访问需要 GitHub 账号登录。仅组织成员可进入，登录后会话有效期 8 小时。</p>
    <a class="login-btn" href="/auth/login">使用 GitHub 账号登录</a>
    <p class="login-foot">登录信息只用于确认身份，不会读取或保存你的其他数据。</p>
  </div>
</main>
<footer class="login-bottom">
  <span>noware-cn / workspace</span>
  <span>会话 8 小时</span>
</footer>
</body>
</html>
