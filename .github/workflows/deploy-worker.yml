name: Deploy Worker

# main 合入即部署；workflow_dispatch 用于在 GitHub 网页上手动选分支部署/复跑
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, test, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run build

      - name: Test
        run: npm test

      - name: Check Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$CF_TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CF_ACCOUNT_ID" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secret:$missing（配置方法见 README「CI/CD」一节）"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # GITHUB_SHA 由 Actions 注入，写入 Worker 的 DEPLOY_COMMIT，供 /api/health 对账
          npm run deploy:ci 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url="$(sed -nE 's#.*(https://[A-Za-z0-9.-]+\.workers\.dev).*#\1#p' "$RUNNER_TEMP/deploy.log" | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### 部署完成"
            echo ""
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- worker: \`approval-visualization-worker\`"
            echo "- 部署地址: ${url:-未从输出解析到}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployment
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL || steps.deploy.outputs.url }}
          EXPECT_COMMIT: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_BASE_URL:-}" ]; then
            echo "::warning::未取到部署地址（可用仓库变量 PROD_BASE_URL 指定），本次只校验线上绑定"
          fi
          for attempt in 1 2 3 4 5 6; do
            if npm run test:prod; then exit 0; fi
            echo "第 ${attempt} 次验证未通过，5 秒后重试"
            sleep 5
          done
          echo "::error::部署后验证失败：/api/health 或 DEPLOY_COMMIT 与 ${EXPECT_COMMIT} 不一致"
          exit 1
