name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run build

      - name: Test
        run: npm test

  production:
    # 依赖 workers.dev / api.cloudflare.com 的验证只在 CI 跑（本地网络不可达）
    name: Production health
    if: vars.PROD_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify deployed worker
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if npm run test:prod; then exit 0; fi
            echo "第 ${attempt} 次验证未通过，5 秒后重试"
            sleep 5
          done
          echo "::error::线上验证失败：$PROD_BASE_URL"
          exit 1
