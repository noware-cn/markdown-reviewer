# Qodo 代码评审配置
# 官方文档：https://docs.qodo.ai/configuration/configuration-file
# 配置参考：https://docs.qodo.ai/configuration/configuration-and-command-reference

[github_app]
# 新 PR 自动执行评审；已有 PR 可通过评论 /agentic_review 手动触发。
pr_commands = ["/agentic_review"]
# 新提交后重新评审。
handle_push_trigger = true
push_commands = ["/agentic_review"]
# 不因 PR 作者为机器人或 AI Agent 而跳过评审。
ignore_bot_pr = false

[review_agent]
# 摘要与精确行内评论同时发布。
comments_location_policy = "both"
# 发布高、中严重度问题；低严重度建议只进入摘要或不发布。
inline_comments_severity_threshold = 2
# 深度评审，优先检查正确性、安全性和回归风险。
override_effort = "extended"
# 按仓库根目录 REVIEW.md 执行项目专属评审规则。
enable_review_md = true
# 新提交后聚焦增量变化。
enable_incremental_review = true
# 不自动批准 PR。
demand_self_review = false
approve_pr_on_self_review = false

issues_user_guidelines = """
请全程使用简体中文进行评审，包括问题标题、问题描述、影响分析、修复建议和总结。代码符号、API、配置键、命令、路径及必要的英文技术术语保持原样。

以证据为基础检查真实缺陷，重点覆盖功能正确性、边界条件、异步竞态、状态一致性、数据完整性、安全漏洞、异常处理、性能和回归风险。必须结合调用链、数据流和实际执行条件判断，不要仅凭代码表面模式报问题。

严格遵守 REVIEW.md 的项目背景、范围边界、严重度和行内评论定位规则。不要自动修改代码，不要把建议性重构包装成缺陷，不要重复报告已修复或已有且未变化的问题。
"""

compliance_user_guidelines = """
请全程使用简体中文。依据仓库 README.md、设计方案和 REVIEW.md 中明确的产品范围与技术约束检查实现是否一致。

重点检查认证与授权边界、OAuth scope、会话与 Cookie 安全、敏感令牌处理、Markdown/HTML 渲染安全、GitHub API 调用与写入权限、评论行号及 Diff 锚点准确性、草稿生命周期、缓存失效、异步请求隔离、Worker 运行时兼容性、CI/CD Secret 使用和部署回滚能力。

本项目当前定位为个人单用户 Markdown 文档审批工作台。不要将多人并发审批、团队权限矩阵、实时协作或复杂工作流作为缺陷要求；但单用户场景仍必须保证会话安全、数据隔离、请求竞态安全和审批结果正确。
"""
